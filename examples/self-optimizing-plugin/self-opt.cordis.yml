# keyless 组合（任务：to-snake-case）：mock llm 驱动 run_tests 一次，供冒烟测试。

- id: mock-llm
  name: './tests/fixtures/mock-optimizer-llm.ts'

- id: hmr
  name: '@deepseek-ai/cordis-plugin-hmr'
  config:
    root: ['.']

- id: solver
  name: './tasks/to-snake-case/solver.ts'

- id: evaluator
  name: './tasks/to-snake-case/evaluator.ts'

- id: optimizer
  name: './src/optimizer.ts'

- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../headless-agent/cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: agent-spine
        name: '@deepseek-ai/dsh-agent-spine-demo'
        config:
          agents:
            - id: main
              provider: self-opt-mock
              model: self-opt-mock
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless self-optimizing-plugin smoke.'
